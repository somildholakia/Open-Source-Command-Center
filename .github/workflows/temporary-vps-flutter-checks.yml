name: Temporary VPS Flutter checks

on:
  push:
    branches:
      - feature/cartoon-local-first-redesign
  workflow_dispatch:

# This workflow is limited to the trusted feature branch and manual runs.
# It must not run for pull requests from arbitrary contributors on a self-hosted runner.
permissions:
  contents: read

concurrency:
  group: temporary-vps-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-source-command-center-vps-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3
